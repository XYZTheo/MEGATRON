#!/usr/sbin/opensips -f
#
# MEGATRON — EDGE / SHIELD NODE
# OpenSIPS 3.6 LTS
#
# ============================================================================
# WHAT THIS NODE IS
# ============================================================================
# This is the ONLY publicly reachable SIP surface in a MEGATRON deployment.
# It is a stateless filter and relay. It exists to absorb hostile traffic so
# that the core never sees it.
#
# TRUST BOUNDARY — these are hard rules, not preferences:
#
#   * This node holds NO database credential.
#   * This node holds NO customer data, tariff data, or PII.
#   * This node is CATTLE. It can be destroyed and reprovisioned in minutes.
#     Nothing here is worth backing up.
#   * A total compromise of this node yields an attacker nothing except the
#     ability to relay SIP to a core that will independently authorize it.
#
# The core binds to a private interface and accepts traffic ONLY from
# allowlisted edge IPs (see ../nftables/megatron-edge.nft). It has no route
# from the public internet. See docs/ARCHITECTURE.md section 4.5b.
#
# ============================================================================
# THE GOVERNING DESIGN RULE
# ============================================================================
#   COST TO REJECT MUST BE FAR BELOW COST TO SEND.
#
# Every check below is ordered cheapest-first, and every rejection happens
# BEFORE t_relay() — i.e. before any transaction state is allocated, before
# any DB lookup, before any memory is committed to the attacker's packet.
#
# A rejected packet must never cost us a malloc.
#
# ============================================================================
# WHY WE DROP SILENTLY INSTEAD OF REPLYING
# ============================================================================
# Replying to a spoofed source does two harmful things at once:
#   1. It makes us a reflection/amplification vector against a third party.
#   2. It doubles our own work per hostile packet.
#
# MagnusBilling's instinct is to politely 403 everything. That is actively
# harmful under attack. Once traffic is classified hostile, we use drop —
# which sends nothing at all.
#
# We only send_reply() to traffic that is malformed but NOT yet classified as
# an attack source, because a real broken client deserves a diagnostic.
#
# ============================================================================
# STATUS: NOT YET VALIDATED AGAINST A RUNNING OPENSIPS 3.6.
# Module and function signatures were verified against the 3.6 documentation,
# but this config has not been loaded by a live opensips binary — no Linux
# host exists for the project yet. Validate with `opensips -C -f opensips.cfg`
# before first deployment.
# ============================================================================

####### Global Parameters #########

log_level=2
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

# Worker counts. UDP gets the most because that is where floods land.
udp_workers=8
tcp_workers=4

# Do not fork on debug builds; leave default (yes) in production.
# fork=yes

# MEMORY IS NOT SET HERE.
#
# `shm_mem_size` and `pkg_mem_size` are NOT OpenSIPS config directives -- they
# are a Kamailio-ism, and 3.6.7 rejects them with a bare "syntax error" that
# points at the line without saying why. Proven on the lab box 2026-08-07.
#
# OpenSIPS takes memory from the command line (-m shared, -M pkg) or, as the
# Debian package runs it, from S_MEMORY and P_MEMORY in /etc/default/opensips.
# The setup wizard sets those; see install/README.md.

# Disable DNS failover lookups on the hot path — a hostile Request-URI must
# never be able to make us do a blocking DNS resolution.
disable_dns_blacklist=no
dns_try_ipv6=no
dns_use_search_list=no

# We are an edge relay; we do not need to auto-discover aliases.
auto_aliases=no

######## Listening sockets ########
# Replace 0.0.0.0 with the node's public IP at provisioning time. The setup
# wizard writes these. Binding explicitly (not 0.0.0.0) is preferred so that
# the private/management interface is never accidentally exposed.

socket=udp:0.0.0.0:5060
socket=tcp:0.0.0.0:5060
socket=tls:0.0.0.0:5061

####### Modules Section ########

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

#### Transports
loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
# NOTE, PROVEN ON 3.6.7: proto_udp.so and proto_tcp.so DO NOT EXIST AS FILES.
# There is no such .so in the module directory and no package ships one --
# UDP and TCP are compiled into the OpenSIPS core. But the loadmodule line is
# still REQUIRED: it is what enables the built-in transport, and without it
# OpenSIPS refuses to start with "no transport protocol loaded".
#
# This cost real time. A check that verifies every loadmodule has a matching
# .so on disk reports these two as missing, which is a FALSE FAILURE, and
# acting on it deletes the lines and breaks the config in a way whose error
# message points somewhere else entirely. ci/render_for_check.py and the CI
# job now know to skip them.
loadmodule "proto_tls.so"

#### TLS management
# TLS/TCP is strategically important, not just for confidentiality:
# a spoofed-source UDP flood CANNOT complete a TCP/TLS handshake. Steering
# customers onto TLS structurally eliminates the entire spoofed-source
# attack class. See docs/ARCHITECTURE.md section 5.2.
loadmodule "tls_mgm.so"
modparam("tls_mgm", "server_domain", "megatron_edge")
modparam("tls_mgm", "certificate", "[megatron_edge]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key", "[megatron_edge]/etc/opensips/tls/privkey.pem")
modparam("tls_mgm", "ca_list",     "[megatron_edge]/etc/opensips/tls/ca.pem")
# Modern only. TLSv1.2 is the floor; the wizard should prefer 1.3.
modparam("tls_mgm", "tls_method",  "[megatron_edge]TLSv1_2+")
modparam("tls_mgm", "verify_cert", "[megatron_edge]0")
modparam("tls_mgm", "require_cert","[megatron_edge]0")

#### Core plumbing
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"

modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)
# NOTE: tm has no `wt_timeout` in OpenSIPS -- that is a Kamailio parameter,
# and 3.6.7 refuses to start with it. The wait timer keeps its default.

# Append the sending socket so replies come back the way they left.
modparam("rr", "append_fromtag", 0)

#### Rate limiting and scanner detection

# PIKE — per-source-IP request density tracking.
#   sampling_time_unit : sampling accuracy in seconds
#   reqs_density_per_unit : requests per unit before an IP is flagged
#   remove_latency : how long the IP stays tracked after its last request
#
# Tuned deliberately tight. Legitimate SIP endpoints are periodic and quiet;
# 16 requests per 2s from one IP is already abnormal for a single endpoint.
# Carrier trunks, which legitimately burst, are allowlisted at nftables and
# are exempted in the routing logic below.
loadmodule "pike.so"
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 16)
modparam("pike", "remove_latency", 120)

# RATELIMIT — global admission control.
# This is the load-shedding valve. When the node is past its safe capacity we
# shed NEW traffic rather than collapse and take established calls with us.
# SBT (slot based taildropping) is used over TAILDROP because TAILDROP resets
# on an interval boundary and lets clients synchronise into a thundering herd.
loadmodule "ratelimit.so"
modparam("ratelimit", "timer_interval", 1)
modparam("ratelimit", "limit_per_interval", 0)   # limits expressed per-second
modparam("ratelimit", "default_algorithm", "SBT")
modparam("ratelimit", "window_size", 5)
modparam("ratelimit", "slot_period", 200)

# CACHEDB_LOCAL — the in-memory dynamic blocklist.
# (This is the OpenSIPS equivalent of Kamailio's htable; OpenSIPS has no
# htable module.) Entries carry a TTL so blocks expire on their own and a
# transient false positive self-heals without operator action.
#
# 2^14 = 16384 buckets. Sized so a broad scan does not degrade lookups.
loadmodule "cachedb_local.so"
modparam("cachedb_local", "cache_collections", "blocklist=14; scanners=12; trunks=8")
modparam("cachedb_local", "cache_clean_period", 30)

#### Source address authorization
# Used to recognise carrier trunks and our own core nodes by IP.
loadmodule "permissions.so"
modparam("permissions", "db_url", "")            # file/static mode, no DB on the edge
modparam("permissions", "address_table", "")

#### Onward relay to the core
# The core is NOT reachable from the internet. These are private addresses.
# db_text: a FLAT FILE database driver, not a database server.
#
# dispatcher hard-requires some sqldb module -- an empty db_url is not enough,
# and 3.6.7 refuses to start with "module dispatcher depends on an sqldb
# module, but none was loaded". Proven on the lab box.
#
# db_text satisfies that dependency while KEEPING THE EDGE CREDENTIAL-FREE,
# which is the property the whole edge/core split exists to protect
# (ARCHITECTURE.md 4.5b, and the EDGE-CREDENTIALS rule in ci/policy_check.py).
# There is no server, no host, no username and no password -- the "database"
# is a text file listing the core nodes. A compromised edge still yields an
# attacker nothing.
#
# Do NOT "fix" this by loading db_postgres here. That would hand an attacker
# who owns an edge node a route to the ledger, and the policy gate will
# reject it.
loadmodule "db_text.so"
loadmodule "dispatcher.so"
modparam("dispatcher", "db_url", "text:///etc/opensips/dbtext")
# NOTE: `partition` is not a dispatcher parameter in OpenSIPS 3.6 -- the
# exported set is db_url / table_name / setid_col / destination_col / ds_*.
# A single dispatcher list is used instead; partitioning, if it is ever
# needed, has to be revisited against the 3.6 module docs.
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_probing_threshold", 3)
modparam("dispatcher", "ds_ping_interval", 10)
# Probe every node so we fail away from a dead core quickly.
modparam("dispatcher", "ds_probing_mode", 1)

#### Topology hiding
# Prevents our customers' addresses leaking to carriers and vice versa, and
# hides the existence and addressing of the core tier from everyone.
loadmodule "topology_hiding.so"

#### Management interface — LOCALHOST ONLY.
# This is how the Go node agent pushes blocklist entries and reads counters.
# It must never be reachable off-box. MagnusBilling's exposed AMI is exactly
# the mistake being avoided here: a control channel that is simultaneously a
# call-origination primitive and a shell primitive.
loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")
modparam("mi_fifo", "fifo_mode", 0660)

####### Routing Logic ########

startup_route {
    xlog("L_NOTICE", "MEGATRON edge node starting — shield tier, stateless, no credentials held\n");
}

route {

    # ------------------------------------------------------------------
    # LAYER 0 — sanity of the SIP transaction itself.
    # Cheapest possible checks first.
    # ------------------------------------------------------------------

    if (!mf_process_maxfwd_header(10)) {
        # Looping message. Do not engage, do not reply.
        xlog("L_INFO", "drop: max-forwards exceeded from $si\n");
        drop;
    }

    # ------------------------------------------------------------------
    # LAYER 1 — is this source already known hostile?
    #
    # This is the single most important check in the file and it is
    # deliberately FIRST among the stateful ones, because it is O(1) and
    # it is what the honeypot feed and the shared reputation feed drive.
    #
    # Sources land here from four places:
    #   1. pike, below (they flooded us)
    #   2. scanner fingerprinting, below (they identified themselves)
    #   3. the honeypot sensor (they touched a decoy IP — see section 5.3);
    #      this is the high-value one, because attackers sweep ranges
    #      sequentially and hit the decoy BEFORE reaching this node
    #   4. the opt-in fleet-wide shared reputation feed (they burned their
    #      infrastructure on some other operator's MEGATRON install)
    #
    # Note the asymmetry we are buying: a hostile source costs us one hash
    # lookup and a drop. It costs the attacker a full packet send.
    # ------------------------------------------------------------------

    if (cache_fetch("local:blocklist", "$si", $var(blocked))) {
        # Silent. No reply. We are not an amplifier.
        drop;
    }

    # ------------------------------------------------------------------
    # LAYER 2 — structural validity.
    #
    # Malformed SIP is either a broken client or an exploit attempt against
    # a parser. Historically ~half of Asterisk's CVEs are memory-safety bugs
    # reachable exactly this way. We refuse to pass malformed messages
    # inward, so the core's parser only ever sees well-formed input.
    #
    # Flags: s = validate SDP body, h = validate header format,
    #        r/f/t = validate Request-URI / From / To URIs and domains
    # ------------------------------------------------------------------

    if (!sipmsg_validate("shrft", $var(sipmsg_err))) {
        xlog("L_INFO", "malformed SIP from $si: $var(sipmsg_err)\n");
        # A single malformed message is not yet proof of hostility, so this
        # source gets one diagnostic reply. Repeat offenders are caught by
        # pike below and stop getting replies entirely.
        send_reply(400, "Bad Request");
        exit;
    }

    # ------------------------------------------------------------------
    # LAYER 3 — scanner fingerprinting.
    #
    # sipvicious, friendly-scanner, sipcli, sundayddr and friends announce
    # themselves in User-Agent. This is free money: a scanner that has not
    # yet found anything is telling us to block it.
    #
    # Blocked for an hour and dropped silently — a scanner that gets no
    # response at all cannot distinguish us from an unused IP, which is
    # exactly the impression we want to leave.
    # ------------------------------------------------------------------

    if ($ua =~ "(?i)(friendly-scanner|sipvicious|sipcli|sundayddr|VaxSIPUserAgent|pplsip|sipsak|iWar|smap)") {
        xlog("L_NOTICE", "scanner fingerprint from $si ua=[$ua] — blocklisting 3600s\n");
        cache_store("local:blocklist", "$si", "scanner", 3600);
        cache_store("local:scanners", "$si", "$ua", 86400);
        drop;
    }

    # An absent User-Agent on an INVITE or REGISTER is not RFC-illegal but is
    # overwhelmingly characteristic of generated attack traffic rather than a
    # real endpoint. We do not block on it alone — we let pike judge — but we
    # do record it so the intel feed can correlate.
    if (($rm == "INVITE" || $rm == "REGISTER") && $ua == NULL) {
        cache_store("local:scanners", "$si", "no-ua", 3600);
    }

    # ------------------------------------------------------------------
    # LAYER 4 — per-source flood detection (pike).
    #
    # Trunks are exempt: a carrier legitimately bursts far above any
    # per-endpoint threshold, and is already IP-allowlisted at nftables,
    # so it has cleared a stronger check than pike could apply.
    # ------------------------------------------------------------------

    if (!route(is_trunk_source)) {
        if (!pike_check_req()) {
            xlog("L_WARN", "pike: flood from $si — blocklisting 600s\n");
            cache_store("local:blocklist", "$si", "pike", 600);
            drop;
        }
    }

    # ------------------------------------------------------------------
    # LAYER 5 — global admission control.
    #
    # Everything above is per-source. This is the whole-node valve, and it
    # is what keeps the promise that we degrade instead of collapsing.
    #
    # A distributed attack from thousands of IPs defeats per-source limits
    # by construction — no single source looks abnormal. This layer is what
    # catches that case. Established calls are unaffected because they are
    # in-dialog and returned above this point.
    #
    # 503 with Retry-After is the correct, RFC-compliant way to shed a NEW
    # request. We are willing to reply here because we have not classified
    # the source as hostile — it may well be a real customer arriving during
    # an attack, and it deserves to know to try again.
    # ------------------------------------------------------------------

    if (!has_totag()) {
        if (!rl_check("global_cps", 200, "SBT")) {
            xlog("L_WARN", "ratelimit: shedding new request from $si (global CPS ceiling)\n");
            send_reply(503, "Service Unavailable");
            exit;
        }
    }

    # ------------------------------------------------------------------
    # In-dialog requests: established calls take the fast path.
    #
    # This is deliberately placed AFTER the cheap hostile checks but BEFORE
    # any further work: a call in progress must survive an attack.
    # ------------------------------------------------------------------

    if (has_totag()) {
        if (loose_route()) {
            if ($rm == "BYE" || $rm == "CANCEL") {
                # Nothing special at the edge; the core owns billing teardown.
                xlog("L_DBG", "in-dialog $rm from $si\n");
            }
            route(relay_to_core);
            exit;
        }
        # A to-tag with no matching route is a stray or a spoof attempt.
        if ($rm == "ACK") {
            route(relay_to_core);
            exit;
        }
        send_reply(404, "Not Found");
        exit;
    }

    # ------------------------------------------------------------------
    # Only initial requests reach here.
    # ------------------------------------------------------------------

    if ($rm == "CANCEL") {
        route(relay_to_core);
        exit;
    }

    if (is_method("OPTIONS") && $ru =~ "^sip:(ping|health)@") {
        # Health probe from our own monitoring. Answer locally; never bother
        # the core with liveness checks.
        send_reply(200, "OK");
        exit;
    }

    # Record-route so in-dialog traffic keeps traversing this edge and cannot
    # be steered around our filtering by a crafted Contact.
    record_route();

    # Hide our internal topology from the far end in both directions.
    topology_hiding("UD");

    route(relay_to_core);
}

# ----------------------------------------------------------------------
# Relay inward to the core tier over the private network.
#
# Note what is absent: there is no authentication, no authorization, no
# rating decision and no database lookup anywhere in this file. The edge
# does not decide whether a call may proceed — it only decides whether a
# packet is worth the core's attention. All trust decisions happen at the
# core, which independently authorizes everything it receives.
#
# That separation is what makes edge compromise survivable.
# ----------------------------------------------------------------------
route[relay_to_core] {

    if (!ds_select_dst(1, 4)) {   # set 1, algorithm 4 = round-robin
        # ds_select_dst takes an INTEGER set id and an INTEGER algorithm.
        # Quoted strings are refused: "Param [1] expected to be an integer
        # or variable". Proven on 3.6.7.
        xlog("L_ERR", "no live core node available — cannot relay\n");
        send_reply(503, "Service Unavailable");
        exit;
    }

    t_on_failure("core_failover");

    if (!t_relay()) {
        send_reply(500, "Server Internal Error");
    }
    exit;
}

failure_route[core_failover] {
    if (t_was_cancelled()) {
        exit;
    }
    # Try the next core node before giving up.
    if (ds_next_dst()) {
        t_on_failure("core_failover");
        t_relay();
        exit;
    }
    xlog("L_ERR", "all core nodes exhausted for call from $si\n");
}

# ----------------------------------------------------------------------
# Is this source one of our configured carrier trunks?
#
# Trunks are IP-authenticated at the nftables layer before they ever reach
# OpenSIPS, so reaching here already implies allowlist membership. This
# helper exists so the routing logic reads clearly and so the exemption is
# expressed in one place.
#
# NOTE: implemented as a route rather than check_source_address() because
# the edge holds no database. The trunk list is a static file written by
# the provisioning agent. See ../nftables/megatron-edge.nft.
# ----------------------------------------------------------------------
route[is_trunk_source] {
    if (cache_fetch("local:trunks", "$si", $var(t))) {
        return(1);
    }
    return(-1);
}
