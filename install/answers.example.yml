# =============================================================================
# MEGATRON — setup wizard answers file
# =============================================================================
#
# Non-interactive input to:
#
#     megatron install --config answers.yml
#
# The interactive TUI also WRITES this file, which is the point: a manual
# install becomes a reproducible one, and the second server is not a fresh
# opportunity to do it differently.
#
# -----------------------------------------------------------------------------
# THERE ARE NO SECRETS IN THIS FILE, AND THERE CANNOT BE
# -----------------------------------------------------------------------------
# No password, no API key, no token, at any nesting level — and
# contracts/wizard-answers.schema.json rejects unknown keys everywhere, so one
# cannot be added by an operator who wants one. Credentials are GENERATED by
# the wizard and written to a mode-0600 secrets file; they are never an input.
#
# That is the structural answer to MagnusBilling's default root/magnus. You
# cannot ship a default password if the config file has nowhere to write one.
#
# The useful consequence: this file is safe to commit to your own
# configuration repository. Reproducible installs stop being in tension with
# keeping credentials out of git.
#
# The same idea is applied wherever a wrong value is an incident rather than a
# preference. `admin.bind` is an enum of loopback forms, so 0.0.0.0 cannot be
# typed. SIP over UDP cannot be enabled without an allowlist. The prepaid
# fail-direction has exactly one legal value.
#
# STATUS: the installer does not exist yet (issue #5). This file is the
# contract it must satisfy, validated by ci/check_wizard_answers.py.
# =============================================================================

version: "0.1.0"

deployment:
  # `shield` is the wedge: MEGATRON in front of your existing switch, relaying
  # clean traffic to it. No migration, no change to your platform.
  profile: shield
  hostname: edge-lhr-01.example.net
  node_id: edge-lhr-01

network:
  # `detect` asks the wizard to determine the address FROM OUTSIDE. Prefer it.
  # A switch behind a NAT nobody noticed is the single biggest source of "it
  # doesn't work" in this industry, and the operator is usually unaware.
  public_ipv4: detect
  rtp_port_range:
    start: 16384
    end: 32768

sip:
  tls:
    certificate:
      source: letsencrypt
      contact_email: noc@example.net
    port: 5061

  # Plain UDP for carriers who still require it. Note that `restrict_to_trunks`
  # has no false case in the schema: enabling UDP means enabling it for an
  # allowlist. A spoofed-source flood cannot complete a TLS handshake, so
  # connection-oriented SIP is structurally immune to that entire attack class
  # — which is why TLS is mandatory and this is the constrained exception.
  udp:
    enabled: true
    restrict_to_trunks: true
    trunks:
      - 203.0.113.0/24
      - 198.51.100.16/28

admin:
  # An enum, not a string. Reach the console over an SSH tunnel or the
  # authenticated reverse proxy.
  bind: 127.0.0.1
  session_timeout_minutes: 30

billing:
  # No defaults here, deliberately. ARCHITECTURE.md 4.4: this must be explicit
  # and must never happen by accident. Rejecting a prepaid call loses one call;
  # allowing it can lose unbounded money to a fraudster.
  fail_direction:
    prepaid: closed
    postpaid: open
  currency: USD

  magnus_import:
    enabled: false
    # dump_path: /var/backups/magnus/magnus.sql
    # `shadow` rates in parallel without billing, so you can compare MEGATRON's
    # figures against your existing switch before trusting it.
    # mode: shadow

shield:
  # `monitor` classifies and reports but blocks nothing — a good way to start,
  # and how the shield proves its false-positive rate on your real traffic
  # before it is trusted to drop anything.
  mode: transparent
  upstream:
    host: 10.0.0.20
    port: 5060

  # The only setting here that sends anything off your box. Off by default.
  # Only attacker addresses and signatures are ever shared — never customer
  # data, never numbers, never Call-IDs.
  reputation_feed:
    share: false
    consume: false

verification:
  # The wizard ends by placing a real call and confirming audio flowed, so your
  # first experience is proof it works rather than a login screen and a hope.
  test_call:
    enabled: true
    destination: "+441632960123"
    # Signalling success is not success. A call that sets up and carries no
    # audio is one of the money-losing failure modes this platform exists to
    # design out, and the habit starts on install day.
    require_media: true
