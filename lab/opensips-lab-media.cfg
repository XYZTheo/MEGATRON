# MEGATRON — single-box lab config, WITH MEDIA
#
# Adds rtpengine to the signalling-only lab. That matters for one specific
# reason: without media stats the switch cannot tell a real conversation from
# a call that connected and carried silence, and billing for silence is one of
# the three money-losing failure modes ARCHITECTURE.md exists to design out.
#
# NOT the production config -- edge/ and core/ are.

log_level=4
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

udp_workers=2

socket=udp:127.0.0.1:5060

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "dialog.so"
loadmodule "rtpengine.so"
loadmodule "rest_client.so"
loadmodule "json.so"
loadmodule "mi_fifo.so"

modparam("mi_fifo", "fifo_name", "/tmp/lab_fifo/opensips_fifo")
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

modparam("rest_client", "connection_timeout", 2)
modparam("rest_client", "curl_timeout", 2)

modparam("dialog", "dlg_match_mode", 1)

route {
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        # loose_route() FIRST -- it is what matches the dialog, and without a
        # matched dialog $DLG_lifetime is empty, which bills a real call as
        # zero seconds.
        $var(routed) = 0;
        if (loose_route()) {
            $var(routed) = 1;
        }

        if (is_method("BYE")) {
            # Read the media stats BEFORE tearing the session down: after
            # rtpengine_delete() there is nothing left to ask.
            $var(stats) = $rtpstat;
            xlog("L_ERR", "MEGATRON: rtpstat for $ci = [$var(stats)]\n");
            rtpengine_delete();
            route(settle);
        }

        if ($var(routed) == 1) {
            t_relay();
        } else {
            send_reply(200, "OK");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        t_relay();
        exit;
    }

    if (!is_method("INVITE")) {
        send_reply(405, "Method Not Allowed");
        exit;
    }

    route(authorize);
}

route[authorize] {
    $json(req) := "{}";
    $json(req/account)     = $fU;
    $json(req/destination) = $rU;
    $json(req/call_id)     = $ci;
    $json(req/source_ip)   = $si;

    if (!rest_post("http://127.0.0.1:8082/v1/authorize", $json(req),
                   "application/json", $var(body), $var(ctype), $var(code))) {
        # PREPAID FAILS CLOSED. Rejecting loses one call; allowing can lose
        # unbounded money to a fraudster.
        xlog("L_ERR", "MEGATRON: authorizer unreachable, failing closed\n");
        send_reply(503, "Service Unavailable");
        exit;
    }

    $json(rsp) := $var(body);

    if ($json(rsp/decision) != "allow") {
        $var(sip) = $json(rsp/sip_code);
        xlog("L_INFO", "MEGATRON: reject $fU -> $rU  $json(rsp/reason) -> $var(sip)\n");
        send_reply($var(sip), "Refused");
        exit;
    }

    $var(maxdur) = $json(rsp/max_seconds);
    xlog("L_ERR", "MEGATRON: allow $fU -> $rU for $var(maxdur)s\n");

    create_dialog();
    $DLG_timeout = $var(maxdur);

    # Anchor the media. Every retail call goes through rtpengine, always:
    # the clients disagree about ICE and NAT, two endpoints that each get it
    # half-right still fail together, and anchoring is also the only way to
    # know whether audio actually flowed.
    if (!rtpengine_offer()) {
        # Not fatal in the lab, but it must be LOUD: a switch that thinks it
        # anchored media and did not has no idea whether audio flowed, which
        # is exactly the blind spot the no-media check exists to close.
        xlog("L_ERR", "MEGATRON: rtpengine_offer FAILED for $ci\n");
    } else {
        xlog("L_ERR", "MEGATRON: rtpengine anchored $ci\n");
    }

    record_route();

    # ARM THE REPLY ROUTE. Declaring onreply_route[handle_reply] does NOT run
    # it -- OpenSIPS only invokes a named reply route for transactions that
    # asked for it. Without this line rtpengine_answer() never runs, rtpengine
    # never learns the callee's media address, and it forwards nothing.
    #
    # The failure is completely silent: the call sets up, both parties think
    # they are talking, and the media stats read "RTP: 0 bytes". On a real
    # switch that is every call with no audio, billed in full.
    t_on_reply("handle_reply");

    $du = "sip:127.0.0.1:5070";
    t_relay();
}

onreply_route[handle_reply] {
    if ($rs =~ "^(18[0-9]|2[0-9][0-9])$") {
        rtpengine_answer();
    }
}

route[settle] {
    $json(end) := "{}";
    $json(end/call_id)      = $ci;
    $json(end/hangup_cause) = "NORMAL_CLEARING";

    $var(dur) = $DLG_lifetime;
    if ($var(dur) == NULL) {
        # Send an explicit 0 rather than omitting the field: omitting it makes
        # the API reject the whole settlement, which silently turns an
        # unmatched dialog into "this call never happened". The switch has its
        # own clock and will fall back to it, tagging the CDR accordingly.
        xlog("L_ERR", "MEGATRON: no dialog for $ci at BYE -- settling at 0s\n");
        $var(dur) = 0;
    }
    $json(end/duration_seconds) = $var(dur);

    # rtpengine reports totals as "key=value;..." -- hand the whole string to
    # the switch rather than parsing it in config script. Parsing in a
    # language with no types, on the money path, is how a format change
    # becomes a silent billing error.
    if ($var(stats) != NULL) {
        $json(end/media_stats) = $var(stats);
    }

    if (!rest_post("http://127.0.0.1:8082/v1/session/end", $json(end),
                   "application/json", $var(body), $var(ctype), $var(code))) {
        xlog("L_ERR", "MEGATRON: SETTLEMENT FAILED for $ci\n");
    } else {
        xlog("L_ERR", "MEGATRON: settled $ci -> $var(body)\n");
    }
}
