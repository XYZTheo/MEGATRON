# MEGATRON — single-box lab config
#
# The smallest thing that proves the money path is really wired to SIP:
# OpenSIPS asks the switch API whether a call may proceed, honours the answer,
# and tells it when the call ends.
#
# This is NOT the production edge or core config (those are in edge/ and
# core/, and both pass `opensips -C`). It exists to answer one question that
# no amount of config review can: does rest_client actually reach our Kotlin
# service, parse its JSON, and act on it.

log_level=2
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

udp_workers=2

socket=udp:127.0.0.1:5060

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "dialog.so"
loadmodule "rest_client.so"
loadmodule "json.so"
loadmodule "mi_fifo.so"

modparam("mi_fifo", "fifo_name", "/tmp/lab_fifo/opensips_fifo")

# Keep the lab honest about latency: a real switch must not block a worker on
# this call, and 2s is long enough to notice if we accidentally do.
modparam("rest_client", "connection_timeout", 2)
modparam("rest_client", "curl_timeout", 2)

modparam("dialog", "dlg_match_mode", 1)

route {
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        # In-dialog. BYE is where the money is settled, and settling comes
        # FIRST -- before any routing decision that might not succeed.
        #
        # A settlement lost because a Route header was not what we expected is
        # revenue lost, and the customer keeps the reservation held against
        # their balance until it ages out. Getting paid must not depend on
        # onward routing working.
        # loose_route() FIRST, because that is what matches the dialog -- and
        # without a matched dialog $DLG_lifetime is empty, so the settlement
        # bills a real call as zero seconds. Settling before routing looked
        # safer and was strictly worse: it guaranteed every call billed 0.
        $var(routed) = 0;
        if (loose_route()) {
            $var(routed) = 1;
        }

        # Settle AFTER the match but BEFORE the relay, and unconditionally.
        # Getting paid must not depend on the onward leg working: a
        # settlement lost to a routing failure is revenue lost and a
        # reservation held against the customer's balance until it ages out.
        if (is_method("BYE")) {
            route(settle);
        }

        if ($var(routed) == 1) {
            t_relay();
        } else {
            # We record-routed this dialog, so an in-dialog request that does
            # not loose-route is still ours to answer. In the lab that is the
            # UAC's BYE arriving without the Route we expected; answering it
            # keeps the test honest about what was actually proven.
            send_reply(200, "OK");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        t_relay();
        exit;
    }

    if (!is_method("INVITE")) {
        send_reply(405, "Method Not Allowed");
        exit;
    }

    route(authorize);
}

route[authorize] {
    # Build exactly the body contracts/authorizer.openapi.yaml describes.
    $json(req) := "{}";
    $json(req/account)     = $fU;
    $json(req/destination) = $rU;
    $json(req/call_id)     = $ci;
    $json(req/source_ip)   = $si;

    if (!rest_post("http://127.0.0.1:8082/v1/authorize", $json(req),
                   "application/json", $var(body), $var(ctype), $var(code))) {
        # The authorizer is unreachable. PREPAID FAILS CLOSED: rejecting loses
        # one call, allowing can lose unbounded money to a fraudster.
        xlog("L_ERR", "MEGATRON: authorizer unreachable, failing closed\n");
        send_reply(503, "Service Unavailable");
        exit;
    }

    $json(rsp) := $var(body);

    if ($json(rsp/decision) != "allow") {
        # The switch API chooses the SIP code, because "no balance" and "we do
        # not carry that destination" are different facts and the customer's
        # softphone should not show the same thing for both.
        $var(sip) = $json(rsp/sip_code);
        xlog("L_INFO", "MEGATRON: reject $fU -> $rU  $json(rsp/reason) -> $var(sip)\n");
        send_reply($var(sip), "Refused");
        exit;
    }

    $var(maxdur) = $json(rsp/max_seconds);
    xlog("L_INFO", "MEGATRON: allow $fU -> $rU for $var(maxdur)s\n");

    create_dialog();
    # The session timer. Without it a prepaid call runs until the balance is
    # already negative and the money is gone.
    $DLG_timeout = $var(maxdur);

    record_route();
    $du = "sip:127.0.0.1:5070";
    t_relay();
}

route[settle] {
    $json(end) := "{}";
    $json(end/call_id)          = $ci;
    # $DLG_lifetime is only populated when the dialog MATCHED. If it did not,
    # sending the field absent makes the API reject the whole settlement with
    # a 500 -- so an unmatched dialog silently became "this call was free".
    #
    # Send an explicit 0 instead. Zero is honest (we genuinely do not know how
    # long it ran) and it still reaches the settlement path, so the
    # reservation is released and a CDR is written rather than the money being
    # held until it ages out. The CDR shows a zero-duration call, which is a
    # visible anomaly rather than a silent loss.
    $var(dur) = $DLG_lifetime;
    if ($var(dur) == NULL) {
        xlog("L_ERR", "MEGATRON: no dialog for $ci at BYE -- settling at 0s\n");
        $var(dur) = 0;
    }
    $json(end/duration_seconds) = $var(dur);
    $json(end/hangup_cause)     = "NORMAL_CLEARING";

    if (!rest_post("http://127.0.0.1:8082/v1/session/end", $json(end),
                   "application/json", $var(body), $var(ctype), $var(code))) {
        # Losing a settlement is losing revenue, so it is logged loudly rather
        # than swallowed. A real deployment retries from the CDR pipeline.
        xlog("L_ERR", "MEGATRON: SETTLEMENT FAILED for $ci\n");
    } else {
        xlog("L_INFO", "MEGATRON: settled $ci -> $var(body)\n");
    }
}
