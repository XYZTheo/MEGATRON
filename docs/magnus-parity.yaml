        issue: 18

  - name: Security, operations and integration
    modules:
      - id: firewall
        magnus: "IP blocking / fail2ban-style controls"
        v1: true
        status: shipped
        note: "The shield tier already exceeds this: nftables baseline, pike/ratelimit, scanner fingerprinting, plus the operator dashboard and telemetry contract. This is the wedge product."
      - id: alarm
        magnus: "Threshold alarms and notifications"
        v1: true
        status: planned
        issue: 4
      - id: restrictedPhonenumber
        magnus: "Blocked destination numbers"
        v1: true
        status: planned
        issue: 7
        note: "Fraud control. Belongs in the authorizer so it is enforced on the money path, not in a UI list somebody forgets to apply."
      - id: configuration
        magnus: "Global settings"
        v1: true
        status: specified
        note: "contracts/wizard-answers.schema.json — and settings that can produce an insecure system are not expressible there at all."
      - id: smtps
        magnus: "Outbound mail server settings"
        v1: false
        status: planned
        issue: 9
      - id: templateMail
        magnus: "Email templates"
        v1: false
        status: planned
        issue: 9
      - id: api
        magnus: "REST API"
        v1: true
        status: specified
        note: "API-first, not API-as-afterthought. CVE-2025-2609/2610 were Magnus APIs served as text/html; MEGATRON is JSON-only with nosniff, and that is already a policy-gate rule."
