name: validate

# WHY THIS WORKFLOW EXISTS
#
# Until now nothing in this repository had ever been executed. The OpenSIPS
# configs and nftables rulesets were written against documentation, on a
# Windows box, with no Linux host available — issue #2 is still open and the
# lab VPS is still unprovisioned.
#
# GitHub's runners are Linux. That means the two things most likely to be
# wrong — a module that does not exist in OpenSIPS 3.6, and an nftables rule
# that does not parse — can be checked today, on every push, without waiting
# for the VPS. The project's own notes record that the Kamailio/OpenSIPS module
# trap already cost real time once; this is the gate that makes it cost
# nothing the second time.
#
# Read ci/render_for_check.py for an honest statement of what a green run here
# does and does not prove. Briefly: it proves the configs are valid, not that
# the switch works.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # --------------------------------------------------------------------
  # Structural rules from CONTRIBUTING.md. Dependency-free and fast, so it
  # runs first and gives the clearest failure message.
  # --------------------------------------------------------------------
  policy:
    name: policy gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prove the gate can fail
        # Runs the gate's own tests before trusting its verdict. A gate that
        # has only ever been seen passing is indistinguishable from a broken
        # one, and this project does not ship security controls on faith.
        run: python3 ci/test_policy_check.py

      - name: Check the repository
        run: python3 ci/policy_check.py

  # --------------------------------------------------------------------
  # The one that matters most: real OpenSIPS 3.6, real module binaries.
  # --------------------------------------------------------------------
  sip-config:
    name: opensips -C
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Add the OpenSIPS 3.6 apt repository
        # Pinned to the 3.6-releases component deliberately. 3.6 is the LTS
        # line (support to 2028-05) that ARCHITECTURE.md section 4.2 commits
        # to; 4.0 is not LTS and carries the largest core rewrite in the
        # project's history. Validating against 4.0 would tell us nothing
        # about what we intend to run.
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://apt.opensips.org/opensips-org.gpg \
            -o /tmp/opensips-org.gpg
          # The published key has been distributed both armoured and binary at
          # different times. Normalise rather than assume.
          if grep -q "BEGIN PGP PUBLIC KEY BLOCK" /tmp/opensips-org.gpg; then
            sudo gpg --dearmor -o /usr/share/keyrings/opensips-org.gpg /tmp/opensips-org.gpg
          else
            sudo cp /tmp/opensips-org.gpg /usr/share/keyrings/opensips-org.gpg
          fi
          echo "deb [signed-by=/usr/share/keyrings/opensips-org.gpg] https://apt.opensips.org noble 3.6-releases" \
            | sudo tee /etc/apt/sources.list.d/opensips.list
          sudo apt-get update

      - name: Install OpenSIPS and the modules the configs load
        # Module-to-package mapping verified against the OpenSIPS Debian
        # packaging, not guessed. The one that catches people out:
        # rest_client lives in opensips-restclient-module, NOT in
        # opensips-http-modules (which is the HTTP transport and MI layer).
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            opensips \
            opensips-postgres-module \
            opensips-json-module \
            opensips-restclient-module \
            opensips-tls-module
          opensips -V

      - name: Fail if we did not actually get 3.6
        # Ubuntu ships its own much older opensips package. If the apt repo
        # step silently did not take effect, apt would install that instead
        # and this whole job would validate the configs against the wrong
        # major version while reporting success.
        run: |
          set -euo pipefail
          version="$(opensips -V | grep -oE 'opensips [0-9]+\.[0-9]+' | head -1 | awk '{print $2}')"
          echo "detected OpenSIPS ${version}"
          if [ "${version}" != "3.6" ]; then
            echo "::error::expected OpenSIPS 3.6 from apt.opensips.org, got ${version}."
            echo "The apt repository step did not take effect, so this check would"
            echo "have validated against the wrong major version."
            exit 1
          fi

      - name: Check every OpenSIPS config in the tree
        # Discovered rather than listed. A tier added later (a second edge
        # profile, a class-5 core) is checked the day it lands instead of the
        # day somebody remembers to add it here — and the job fails if it finds
        # nothing, so an empty glob can never be mistaken for success.
        run: |
          set -euo pipefail
          mkdir -p /tmp/fifo /tmp/rendered
          shopt -s nullglob
          configs=(*/opensips/*.cfg)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "::error::no OpenSIPS configs found — this job would have passed vacuously"
            exit 1
          fi
          echo "found ${#configs[@]} config(s): ${configs[*]}"
          rc=0
          for cfg in "${configs[@]}"; do
            tier="$(echo "${cfg}" | cut -d/ -f1)"
            echo "::group::opensips -C ${cfg}"
            python3 ci/render_for_check.py "${cfg}" "/tmp/rendered/${tier}.cfg" /tmp/fifo
            if opensips -C -f "/tmp/rendered/${tier}.cfg"; then
              echo "${cfg}: OK"
            else
              echo "::error file=${cfg}::opensips -C rejected this config"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  # --------------------------------------------------------------------
  # nftables rulesets. `nft -c` parses and validates without loading.
  # --------------------------------------------------------------------
  firewall:
    name: nft -c
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables

      - name: Check every nftables ruleset in the tree
        run: |
          set -euo pipefail
          shopt -s nullglob
          rulesets=(*/nftables/*.nft)
          if [ ${#rulesets[@]} -eq 0 ]; then
            echo "::error::no nftables rulesets found — this job would have passed vacuously"
            exit 1
          fi
          rc=0
          for rs in "${rulesets[@]}"; do
            echo "::group::nft -c ${rs}"
            if sudo nft -c -f "${rs}"; then
              echo "${rs}: OK"
            else
              echo "::error file=${rs}::nft -c rejected this ruleset"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Assert the core ruleset is default-deny in every direction
        # The core's security claim is that it has no route from the internet.
        # That claim rests entirely on the input, forward AND output chains
        # defaulting to drop. A future edit that relaxed any one of them would
        # silently dissolve the guarantee while every other check still
        # passed, so it is asserted explicitly rather than left to review.
        run: |
          set -euo pipefail
          core=core/nftables/megatron-core.nft
          if [ ! -f "${core}" ]; then
            echo "core ruleset not present on this branch — nothing to assert"
            exit 0
          fi
          for chain in input forward output; do
            if ! grep -qE "hook ${chain}[^;]*;[[:space:]]*policy drop;" "${core}"; then
              echo "::error file=${core}::core ${chain} chain is not 'policy drop'."
              echo "ARCHITECTURE.md 4.5b depends on the core being default-deny."
              exit 1
            fi
            echo "core ${chain}: policy drop — ok"
          done

  # --------------------------------------------------------------------
  # The authorizer contract is the SIP/money boundary. If it stops being a
  # valid OpenAPI document, every generated client downstream breaks.
  # --------------------------------------------------------------------
  contract:
    name: authorizer contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validator
        run: pip install --quiet openapi-spec-validator==0.7.1

      - name: Validate contracts/authorizer.openapi.yaml
        run: python3 -m openapi_spec_validator contracts/authorizer.openapi.yaml
