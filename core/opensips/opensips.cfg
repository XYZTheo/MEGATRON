#!/usr/sbin/opensips -f
#
# MEGATRON — CORE TIER
# OpenSIPS 3.6 LTS
#
# ============================================================================
# WHAT THIS NODE IS
# ============================================================================
# The core is where trust lives. Registrar, dialog state, call authorization,
# media control, and the connection to the authorizer.
#
# CRITICALLY: THIS NODE HAS NO ROUTE FROM THE PUBLIC INTERNET.
#
# It binds a private interface and accepts SIP only from allowlisted edge node
# addresses, enforced at nftables *and* re-checked here. An attacker cannot
# flood it, scan it, or reach a single port — not because we filter well, but
# because there is no path. That is genuine unreachability, and it is the most
# important structural property of the whole design.
#
# See docs/ARCHITECTURE.md section 4.5b and edge/README.md.
#
# ============================================================================
# WHY THIS CONFIG IS DELIBERATELY THIN
# ============================================================================
# Almost no decision is made here. Authentication is checked, dialog state is
# tracked, media is anchored — and everything else is asked of the authorizer
# over async HTTP.
#
# In particular, THERE IS NO LCR LOGIC IN THIS FILE. No drouting, no lcr, no
# carrierroute. Route selection happens inside the authorizer, which already
# holds tariff and gateway data in memory to meet its 5 ms budget, and which is
# our proprietary code.
#
# That is not an accident. It serves two goals at once:
#
#   * ARCHITECTURE: rating and routing are the same decision. Splitting them
#     across a GPL module's database tables and our rating engine would mean
#     two sources of truth for "which gateway and at what cost".
#
#   * LICENCE: MEGATRON is proprietary and OpenSIPS is GPLv2. Keeping our
#     business logic on the far side of a network boundary — rather than inside
#     module configuration or a custom C module — keeps that boundary clean.
#     See CONTRIBUTING.md, "Licence discipline".
#
# The licence-clean path and the correct architecture coincide here. Lean on it.
#
# ============================================================================
# STATUS: NOT YET VALIDATED AGAINST A RUNNING OPENSIPS 3.6.
# Verify with `opensips -C -f opensips.cfg` before deployment. See issue #2.
# ============================================================================

####### Global Parameters #########

log_level=2
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

udp_workers=8
tcp_workers=4


######## Listening sockets ########
#
# PRIVATE ADDRESS ONLY. If you ever find yourself putting a public IP here,
# stop — you are dissolving the property that makes this design work.
# The setup wizard writes this value and refuses public addresses.

socket=udp:10.0.0.10:5060
socket=tcp:10.0.0.10:5060

####### Modules Section ########

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

# MEMORY IS NOT SET HERE.
#
# `shm_mem_size` and `pkg_mem_size` are NOT OpenSIPS config directives -- they
# are a Kamailio-ism, and 3.6.7 rejects them with a bare "syntax error" that
# points at the line without saying why. Proven on the lab box 2026-08-07.
#
# OpenSIPS takes memory from the command line (-m shared, -M pkg) or, as the
# Debian package runs it, from S_MEMORY and P_MEMORY in /etc/default/opensips.
# The setup wizard sets those; see install/README.md.

loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
# NOTE, PROVEN ON 3.6.7: proto_udp.so and proto_tcp.so DO NOT EXIST AS FILES.
# There is no such .so in the module directory and no package ships one --
# UDP and TCP are compiled into the OpenSIPS core. But the loadmodule line is
# still REQUIRED: it is what enables the built-in transport, and without it
# OpenSIPS refuses to start with "no transport protocol loaded".
#
# This cost real time. A check that verifies every loadmodule has a matching
# .so on disk reports these two as missing, which is a FALSE FAILURE, and
# acting on it deletes the lines and breaks the config in a way whose error
# message points somewhere else entirely. ci/render_for_check.py and the CI
# job now know to skip them.

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "uac.so"

modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 120)

#### Persistence — subscriber credentials and location
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("usrloc", "db_mode", 1)              # write-through; survives restart
modparam("usrloc", "db_url", "postgres://opensips@10.0.0.20/megatron")
modparam("auth_db", "db_url", "postgres://opensips@10.0.0.20/megatron")
# calculate_ha1 = 0. THE PREVIOUS VALUE OF 1 WAS A BUG, AND A TOTAL ONE.
#
# calculate_ha1=1 tells auth_db that password_column holds a PLAINTEXT
# password, which it then MD5s itself. Combined with password_column="ha1" —
# a column that already holds MD5(user:realm:password) — OpenSIPS would have
# hashed the hash and compared it against the phone's digest. Not a weakened
# check: no customer could ever have registered, and the comment sat next to
# it claiming the opposite.
#
# It is 0 because the column holds HA1, which is what provisioning stores and
# what a softphone computes. Proven against a real registration in the lab:
# see lab/register-test.sh and lab/README.md.
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")

# Load NO extra credential columns. auth_db defaults this to "rpid" and then
# fails the ENTIRE lookup with `column <rpid> not found` if the table has not
# got one — which surfaces as a 500 on every REGISTER, not as a missing
# optional field. MEGATRON has no use for Remote-Party-ID: caller ID comes
# from the customer record, verified, and letting a subscriber row carry its
# own would be a customer choosing the number their calls present as.
modparam("auth_db", "load_credentials", "")

# A nonce this switch issued is good for 60 seconds.
#
# Shorter than the default, because it bounds how long a captured
# Authorization header is worth replaying. Not shorter still, because a stale
# nonce is answered with 403 like any other failed credential — see
# route[deny_or_challenge] for why it cannot be special-cased without
# reopening an enumeration oracle — so every expiry a real phone hits costs it
# a registration cycle. 60s is comfortably longer than any softphone takes to
# answer a challenge it just received, and short enough that a captured header
# is stale before it is useful.
modparam("auth", "nonce_expire", 60)

# Registration: 5 minutes maximum. Short expiry costs a little signalling and
# buys fast convergence when a customer's endpoint is compromised and removed.
modparam("registrar", "default_expires", 300)
modparam("registrar", "max_expires", 600)
modparam("registrar", "min_expires", 60)

#### Source authorization — which edges may talk to us
loadmodule "permissions.so"
modparam("permissions", "db_url", "postgres://opensips@10.0.0.20/megatron")
modparam("permissions", "address_table", "address")

#### Dialog — call state, concurrency limits, and the max-duration enforcement
loadmodule "dialog.so"
modparam("dialog", "db_mode", 1)
modparam("dialog", "db_url", "postgres://opensips@10.0.0.20/megatron")

# Backstop only. The real bound is $DLG_timeout using the authorizer's
# maxDurationSeconds. OpenSIPS defaults this to 12 hours, which is how a lost
# BYE turns into a call billed all night. 4 hours is a deliberate ceiling; any
# legitimate call longer than this is exceptional and should be alarmed.
modparam("dialog", "default_timeout", 14400)

# Ping the endpoints of established dialogs. Combined with rtpengine's media
# timeout and RFC 4028 session timers, this is one of three independent
# mechanisms against the lost-BYE problem. We use all three because each
# catches cases the others miss.
modparam("dialog", "options_ping_interval", 30)

#### Media control
loadmodule "rtpengine.so"
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("rtpengine", "rtpengine_disable_tout", 20)

#### The authorizer connection — the money boundary
#
# ASYNC IS NOT OPTIONAL. `async(rest_post(...), resume_route)` suspends the SIP
# transaction and frees the worker; the resume route runs when the response
# arrives. A synchronous call would block a worker for the whole round trip:
# at 5,000 CPS with 64 workers, a 20 ms blocking lookup caps the node at
# 3,200 CPS, and one slow response stalls everything.
loadmodule "rest_client.so"

# The OpenSIPS defaults are 20 SECONDS for both of these, which is far beyond
# anything acceptable on a call-setup path — a caller retransmits the INVITE
# after 500 ms (SIP Timer T1).
#
# TODO(#3): these parameters are second-granularity. Confirm whether 3.6
# exposes millisecond variants; if not, the authorizer's own deadline plus
# tm's fr_timeout are what actually bound post-dial delay, and 1s here is only
# a backstop against a hung socket.
modparam("rest_client", "connection_timeout", 1)
modparam("rest_client", "curl_timeout", 1)

#### JSON handling
#
# We build the authorizer request with the json module rather than by
# concatenating strings.
#
# This is a security control, not a style choice. SIP header values are
# attacker-controlled: a crafted From display-name containing a quote and a
# brace can break out of naively concatenated JSON and inject fields into the
# authorization request. Structured construction makes that impossible, in the
# same way parameterised queries make SQL injection impossible.
loadmodule "json.so"

#### Management — localhost only, never off-box
loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")
modparam("mi_fifo", "fifo_mode", 0660)

####### Routing Logic ########

startup_route {
    xlog("L_NOTICE", "MEGATRON core starting — private tier, no public route\n");
}

route {

    # ------------------------------------------------------------------
    # GATE: only edge nodes may speak to the core.
    #
    # nftables already enforces this. We re-check in SIP anyway: defence in
    # depth costs one lookup, and a firewall misconfiguration during a
    # provisioning change should degrade to "calls rejected", never to
    # "core exposed".
    # ------------------------------------------------------------------

    if (!check_source_address(1)) {     # group 1 = edge nodes
        xlog("L_WARN", "core reached from non-edge source $si — dropping\n");
        drop;
    }

    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    # The edge already validated structure, but the core must not depend on
    # the edge having done its job — the edge is in a lower trust domain.
    if (!sipmsg_validate("shrft", $var(err))) {
        xlog("L_WARN", "malformed SIP reached core from edge $si: $var(err)\n");
        send_reply(400, "Bad Request");
        exit;
    }

    # ------------------------------------------------------------------
    # In-dialog requests
    # ------------------------------------------------------------------

    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                # Billing teardown happens in the dialog end callback, not here,
                # so that a BYE lost in transit still produces a CDR via dialog
                # timeout. Never make the CDR depend on receiving a BYE.
                rtpengine_delete();
            } else if (is_method("INVITE")) {
                # Re-INVITE: media may be changing (hold, codec change).
                rtpengine_offer();
            }
            route(relay);
            exit;
        }
        if (is_method("ACK")) {
            route(relay);
            exit;
        }
        send_reply(404, "Not Found");
        exit;
    }

    # ------------------------------------------------------------------
    # Initial requests
    # ------------------------------------------------------------------

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(relay);
        }
        exit;
    }

    t_check_trans();

    if (is_method("REGISTER")) {
        route(handle_register);
        exit;
    }

    if (is_method("INVITE")) {
        route(handle_invite);
        exit;
    }

    if (is_method("OPTIONS")) {
        send_reply(200, "OK");
        exit;
    }

    send_reply(405, "Method Not Allowed");
}

# ----------------------------------------------------------------------
# Failed authentication — shared by REGISTER and INVITE, because the two
# must answer identically.
#
# THE RESPONSE MUST NOT REVEAL WHETHER AN ACCOUNT EXISTS.
#
# The obvious implementation — and the one that was here — re-challenges
# every failure. auth_db reports a wrong password and an unknown handle as
# different failures, so any handling that branches on them produces a
# username enumeration oracle: an attacker sends any password at a guessed
# handle and reads the reply to learn whether the account is real. One packet
# per guess, no valid credential needed, and having enumerated the real
# handles, brute force has somewhere to point. It is precisely what the SIP
# scanners hitting MagnusBilling installs are looking for, and this project
# exists because those attacks work.
#
# So ONE question decides the wire answer — did this request carry
# credentials? — and never whether those credentials named a real account.
#
#   no credentials    -> 401 (registrar) / 407 (proxy), the normal first
#                        half of a digest exchange
#   credentials       -> 403, identical for every cause of failure
#
# The cause still reaches the OPERATOR, in the log, where an attacker cannot
# read it. Logged, not sent: that is the whole trick.
#
# A stale nonce is deliberately NOT special-cased. Measured on 3.6.7, a wrong
# password returns -2 and an unknown account returns -1 — which is also the
# generic error code — so branching on return codes reintroduces the oracle
# inverted. is_nonce_stale() would settle it but exists only as a C symbol in
# 3.6 and is not callable from config. A phone whose nonce expired recovers on
# its next registration cycle from a fresh challenge; nonce_expire is set
# accordingly. See lab/README.md.
# ----------------------------------------------------------------------
route[deny_or_challenge] {
    $var(why) = $rc;

    if ($hdr(Authorization) == NULL && $hdr(Proxy-Authorization) == NULL) {
        # A registrar challenges with 401 and a proxy with 407. Sending the
        # wrong one makes the phone put its credentials in the wrong header,
        # which the other function does not read — an endless challenge loop
        # with a correct password.
        if (is_method("REGISTER")) {
            www_challenge("", "auth");
        } else {
            proxy_challenge("", "auth");
        }
        exit;
    }

    xlog("L_WARN", "AUTH DENIED method=$rm claimed=$fU src=$si:$sp rc=$var(why)\n");
    send_reply(403, "Forbidden");
    exit;
}

# ----------------------------------------------------------------------
# REGISTER — class-5 retail endpoints
# ----------------------------------------------------------------------
route[handle_register] {

    if (!www_authorize("", "subscriber")) {
        route(deny_or_challenge);
        exit;
    }

    # The authenticated identity must match the AoR being registered.
    # Without this check any valid subscriber could register as any other —
    # a trivial account-takeover primitive.
    # db_check_to() is a Kamailio `uri` module function; OpenSIPS has no such
    # module. The property it asserted -- that the To user is the account that
    # authenticated -- is checked directly instead.
    # $tU IS THE ONE THAT MATTERS. The registrar takes the address-of-record
    # from the To header (RFC 3261 s10.2), so this is the check that stops a
    # valid credential registering a binding for somebody ELSE's account and
    # receiving their inbound calls. (The lab config checked only $fU for a
    # while, which let that attack straight through while its comment
    # described it — see lab/README.md.)
    if ($tU != $au) {
        xlog("L_WARN", "REGISTER AOR mismatch: auth=$au to=$tU from $si\n");
        send_reply(403, "Forbidden");
        exit;
    }
    # From does not register anything, but a mismatch here is still a client
    # doing something it has no reason to do.
    if ($fU != $au) {
        xlog("L_WARN", "REGISTER identity mismatch: auth=$au from=$fU src $si\n");
        send_reply(403, "Forbidden");
        exit;
    }

    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

# ----------------------------------------------------------------------
# INVITE — ask the authorizer, then route.
# ----------------------------------------------------------------------
route[handle_invite] {

    # Send 100 Trying immediately. This stops the caller's retransmission
    # timer (SIP T1 = 500 ms) and buys us the time to consult the authorizer.
    # It must happen before any lookup.
    t_newtran();
    t_reply(100, "Trying");

    # --- Authenticate, by whichever model applies ---

    if (check_source_address(2, $var(trunk_id))) {
        # Class-4: IP-authenticated carrier trunk.
        #
        # Note the known weakness we are compensating for: IP auth does not
        # protect against a multi-tenant third-party platform, because any
        # user of that platform sends from the same allowed address. Trunks
        # therefore still get velocity and destination controls downstream —
        # being a trunk is not a licence to dial anything.
        $var(source_type) = "IP_TRUNK";
    } else {
        # Class-5: digest-authenticated subscriber.
        if (!proxy_authorize("", "subscriber")) {
            route(deny_or_challenge);
            exit;
        }
        # Same as above: assert the From user is the authenticated account, rather
    # than calling a function that does not exist here. This is the check that
    # stops a registered customer presenting somebody else as the caller.
    if ($fU != $au) {
            xlog("L_WARN", "INVITE From-spoof attempt: auth=$au from=$fU\n");
            send_reply(403, "Forbidden");
            exit;
        }
        $var(source_type) = "REGISTERED_SUBSCRIBER";
    }

    # --- Build the authorization request ---
    #
    # Structured construction, never string concatenation. $fU/$tU/$ua are
    # attacker-controlled; see the json module comment above.

    $json(authreq) := "{}";
    $json(authreq/callId)        = $ci;
    $json(authreq/tenantId)      = $avp(tenant_id);
    $json(authreq/direction)     = "OUTBOUND";
    # For a registered subscriber this is $au — WHO THEY PROVED THEY ARE —
    # not $fU, which is only what the header claims. The check above has
    # already asserted the two are equal, so this changes nothing today; it
    # exists so that a future edit weakening that check cannot silently turn
    # the bill back into a claim. An IP trunk has no digest identity, so
    # there $fU is all there is, and the allowlist is what stands behind it.
    if ($var(source_type) == "REGISTERED_SUBSCRIBER") {
        $json(authreq/callingNumber) = $au;
    } else {
        $json(authreq/callingNumber) = $fU;
    }
    $json(authreq/calledNumber)  = $rU;
    $json(authreq/edgeNode)      = $si;
    $json(authreq/transport)     = $socket_in(proto);

    $json(authreq/source)        := "{}";
    $json(authreq/source/type)   = $var(source_type);
    if ($var(source_type) == "IP_TRUNK") {
        $json(authreq/source/trunkId)  = $var(trunk_id);
        $json(authreq/source/sourceIp) = $si;
    } else {
        $json(authreq/source/authUsername) = $au;
        $json(authreq/source/contactIp)    = $si;
    }

    # --- Ask. Asynchronously. ---

    async(rest_post("http://authorizer.megatron.internal:8080/v1/authorize",
                    $json(authreq), "application/json",
                    $var(authresp), $var(rctype), $var(httpcode)),
          resume_authorize);
}

# ----------------------------------------------------------------------
# The authorizer answered (or didn't).
# ----------------------------------------------------------------------
route[resume_authorize] {

    # ------------------------------------------------------------------
    # FAIL DIRECTION — a business decision, never an accident.
    #
    #   prepaid          -> FAIL CLOSED. Refusing a call loses one call.
    #                       Allowing it can lose unbounded money to a fraudster.
    #   trusted postpaid -> FAIL OPEN. These customers are credit-checked and
    #                       contractually liable; refusing their traffic during
    #                       OUR outage is worse than billing them slightly late.
    #
    # TODO(#7): $avp(billing_mode) must be populated from the trunk/subscriber
    # record at authentication time. Until the authorizer exists, this path
    # fails closed for everyone, which is the safe default.
    # ------------------------------------------------------------------

    if ($rc < 0 || $var(httpcode) != 200) {
        xlog("L_ERR", "authorizer unreachable (rc=$rc http=$var(httpcode)) for call $ci\n");

        if ($avp(billing_mode) == "POSTPAID_TRUSTED") {
            xlog("L_WARN", "failing OPEN for trusted postpaid call $ci — must be reconciled later\n");
            # Mark it so reconciliation knows this call was never rated.
            $json(unrated) := "{}";
            route(route_call_unrated);
            exit;
        }

        send_reply(503, "Service Unavailable");
        exit;
    }

    $json(auth) := $var(authresp);

    if ($json(auth/decision) != "ALLOW") {
        xlog("L_NOTICE", "call $ci denied: $json(auth/denyReason)\n");

        # Map the deny reason to an honest SIP code. Specific codes matter:
        # "call failed" with no detail is the single largest support burden in
        # this industry, and an operator debugging a customer complaint at 2am
        # should not have to guess.
        if ($json(auth/denyReason) == "INSUFFICIENT_BALANCE" ||
            $json(auth/denyReason) == "CREDIT_LIMIT_EXCEEDED") {
            send_reply(402, "Payment Required");
        } else if ($json(auth/denyReason) == "CONCURRENCY_LIMIT_EXCEEDED" ||
                   $json(auth/denyReason) == "VELOCITY_LIMIT_EXCEEDED") {
            send_reply(486, "Busy Here");
        } else if ($json(auth/denyReason) == "NO_ROUTE_AVAILABLE" ||
                   $json(auth/denyReason) == "NO_RATE_FOR_DESTINATION") {
            send_reply(404, "Not Found");
        } else if ($json(auth/denyReason) == "DESTINATION_NOT_ALLOWED" ||
                   $json(auth/denyReason) == "DESTINATION_BLOCKED_HIGH_RISK" ||
                   $json(auth/denyReason) == "FRAUD_HOLD") {
            send_reply(403, "Forbidden");
        } else {
            send_reply(403, "Forbidden");
        }
        exit;
    }

    # --- Allowed. Set up dialog tracking and the hard duration bound. ---

    $avp(session_id) = $json(auth/sessionId);

    if (!create_dialog("B")) {     # B = generate BYE on timeout
        xlog("L_ERR", "failed to create dialog for $ci\n");
        send_reply(500, "Server Internal Error");
        exit;
    }

    # The hard billable bound, enforced by the proxy at ZERO ongoing cost.
    # No polling, no timers of ours. This single call is what makes prepaid
    # safe without a mid-call heartbeat on every session.
    $var(maxdur) = $json(auth/maxDurationSeconds);
    if ($var(maxdur) > 0) {
        $DLG_timeout = $var(maxdur);
    }

    # Anchor media. Default-on: skipping it costs NAT traversal, recording,
    # SRTP bridging, transcoding, and — critically for billing — any knowledge
    # of whether audio actually flowed.
    if ($json(auth/routes[0]/anchorMedia) != "false") {
        rtpengine_offer();
    }

    # Route to the gateway the authorizer selected. LCR happened there.
    $ru = $json(auth/routes[0]/gatewayUri);

    t_on_reply("handle_reply");
    t_on_failure("handle_failure");

    record_route();

    if (!t_relay()) {
        send_reply(500, "Server Internal Error");
    }
    exit;
}

# ----------------------------------------------------------------------
# Postpaid fail-open path: route without a rating decision.
# These calls MUST be reconciled and rated retrospectively.
# ----------------------------------------------------------------------
route[route_call_unrated] {
    xlog("L_WARN", "UNRATED call $ci proceeding — reconciliation required\n");
    create_dialog("B");
    $DLG_timeout = 3600;          # conservative cap on an unrated call
    rtpengine_offer();
    record_route();
    t_relay();
    exit;
}

route[relay] {
    if (!t_relay()) {
        send_reply(500, "Server Internal Error");
    }
    exit;
}

onreply_route[handle_reply] {
    # $rs is the reply status. `status` as a bare word is Kamailio; OpenSIPS
    # refuses it with "bare word <status> found, command calls need '()'".
    if ($rs =~ "^(18[013]|2[0-9][0-9])$") {
        rtpengine_answer();
    }
}

failure_route[handle_failure] {
    if (t_was_cancelled()) {
        exit;
    }
    rtpengine_delete();
    # TODO(#7): release the authorizer's credit reservation immediately on
    # failure rather than waiting for its TTL. Correctness does not depend on
    # this — the reservation self-releases — but it stops a burst of failed
    # calls temporarily tying up a customer's credit.
}
